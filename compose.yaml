services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: outreach
      POSTGRES_USER: outreach
      POSTGRES_PASSWORD: outreach
    volumes:
      - outreach_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach -d outreach"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    # Published image (Intel/AMD and Apple silicon). `docker compose up --build` builds from this folder instead.
    image: archit690/genai-outreach:latest
    pull_policy: missing
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://outreach:outreach@db:5432/outreach
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz')"]
      interval: 5s
      timeout: 3s
      retries: 20
  # One-time setup: asks for your operator password and writes .env into this folder.
  # Run with: docker compose run --rm setup
  setup:
    image: archit690/genai-outreach:latest
    pull_policy: missing
    build: .
    profiles: ["setup"]
    volumes:
      - .:/work
    working_dir: /work
    environment:
      PYTHONPATH: /app
    command: ["python", "-m", "scripts.bootstrap", "--fixture-demo"]
volumes:
  outreach_db:
